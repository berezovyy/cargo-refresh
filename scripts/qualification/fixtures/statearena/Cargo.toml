[package]
name = "statearena"
version = "0.1.0"
edition = "2024"
[dependencies]
statearena-derive = { path = "../statearena-derive" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libc = "0.2"

uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
