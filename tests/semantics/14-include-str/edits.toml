schema = 1
case = "14-include-str"
title = "Embedded non-Rust input"
v0_1 = ["stock", "works"]
state_rule = "Changing message.txt must change the embedded bytes. A watcher that only sees .rs edits would silently serve stale data. Stock fallback is the conservative route; live is acceptable only with correct input tracking."
base_probes = ["probe=message-v1", "probe=message-v1"]

[environment]

[unset_environment]

[[steps]]
name = "edit-1"
stock_after_restart = ["probe=message-v2", "probe=message-v2"]
live_expected = ["probe=message-v2", "probe=message-v2"]

[[steps.edits]]
file = "message.txt"
find = "message-v1\n"
replace = "message-v2\n"
